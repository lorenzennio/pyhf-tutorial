[workspace]
authors = ["Lorenz Gaertner <lorenz.gaertner@gmail.com>"]
channels = ["conda-forge"]
name = "pyhf-tutorial"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
nb = "jupyter notebook"
jlab = "jupyter lab"

[dependencies]
python = ">=3.13.7,<3.14"
numpy = ">=2.3.3,<3"
scipy = ">=1.16.2,<2"
matplotlib = ">=3.10.6,<4"
pyhf = ">=0.7.6,<0.8"
cabinetry = ">=0.6.0,<0.7"
ipykernel = ">=6.30.1,<7"
uproot = ">=5.6.5,<6"
pandas = ">=2.3.2,<3"
awkward-pandas = ">=2023.8.0,<2024"
python-dotenv = ">=1.1.1,<2"
ipywidgets = ">=8.1.7,<9"
mplhep = ">=0.4.1,<0.5"
jupyter = ">=1.1.1,<2"
ipympl = ">=0.9.7,<0.10"
